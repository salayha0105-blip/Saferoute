name: Fetch police stations and hospitals
on:
  workflow_dispatch:
  push:
    paths: [tools/fetch_pois.py, .github/workflows/fetch-pois.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install osmnx==2.0.1
      - run: python tools/fetch_pois.py
      - name: Commit the downloaded places
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git commit -m "Add OpenStreetMap police stations and hospitals" || echo "nothing to commit"
          git push
